# ByteTrack for static sky-facing camera (fast, motion-only association).
# BoT-SORT is better for moving/broadcast cameras; ByteTrack is correct here.
# See: https://docs.ultralytics.com/modes/track/
tracker_type: bytetrack
track_high_thresh: 0.20
track_low_thresh: 0.05
new_track_thresh: 0.20
track_buffer: 60
match_thresh: 0.70
fuse_score: true
